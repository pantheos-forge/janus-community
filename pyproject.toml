[project]
name = "janus"
version = "0.1.0"
description = "Janus — a generic AI-agent template system that builds subject-matter-expert agents"
requires-python = ">=3.12,<4.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.60",
]
art = [
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "claude-agent-sdk>=0.2",
    "textual>=0.60",
    "pillow>=10.0",
]
claude-sdk = [
    "claude-agent-sdk>=0.2",
]

[project.scripts]
janus = "janus.interface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
